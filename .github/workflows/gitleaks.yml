# Robô que procura senha, token ou chave esquecida no código, a cada push (Ticket 010).
# Baixa o gitleaks OFICIAL e confere a impressão digital (sha256) antes de rodar:
# se o arquivo tiver sido trocado no caminho, o robô para e não executa nada.
name: gitleaks (segredos)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSAO: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código (histórico inteiro)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todos os commits, não só o último
          persist-credentials: false # não deixa a senha do robô salva no disco

      - name: Baixar o gitleaks oficial e conferir o sha256
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks

      - name: Varrer o histórico (segredo achado = robô vermelho)
        run: ./gitleaks git . --redact --no-banner --exit-code 1
