# Robô que roda os testes do lado Python (cérebro ↔ braços) a cada push.
# Só biblioteca padrão: não instala nada (os testes não precisam de Ollama, microfone nem voz).
name: Testes Python (cerebro)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false # não deixa a senha do robô salva no disco

      - name: Instalar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Rodar os testes
        run: python -m unittest discover -s tests -t . -v
