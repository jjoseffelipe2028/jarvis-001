# Roda os testes do braço Java (bracos) a cada push e pull request.
# Peças oficiais do GitHub: actions/checkout e actions/setup-java.
name: Testes Java (bracos)

on:
  push:
  pull_request:
  workflow_dispatch: # botão "Run workflow" para rodar na mão

# Menor privilégio: o robô só LÊ o repositório.
permissions:
  contents: read

jobs:
  testes:
    # Linux E Windows: o Jarvis roda no Windows, então testes "só Windows" (ex.: caminho com \) também rodam aqui
    strategy:
      fail-fast: false # se um sistema falhar, o outro termina e mostra o resultado
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # Git Bash no Windows: o mesmo comando ./mvnw nos dois sistemas
        working-directory: java/bracos
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false # não deixa a senha do robô salva no disco

      - name: Instalar Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/bracos/pom.xml

      - name: Dar permissão de execução ao mvnw
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Rodar os testes
        run: ./mvnw -B test
