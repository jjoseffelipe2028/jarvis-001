spring.application.name=bracos


# Seguranca: so o meu PC acessa (nada aberto para a rede)
server.address=127.0.0.1
server.port=8080

# Token secreto e pastas: valores vem do .env (via iniciar.sh). Vazio = recusa tudo (falha fechada).
jarvis.token=${JARVIS_TOKEN:}
jarvis.pastas.daily=${JARVIS_PASTA_DAILY:}
jarvis.pastas.git=${JARVIS_PASTA_GIT:}
# Ticket 013: relatorios de retencao de video (ex.: <cofre>/decisions/videos). Vazio = acao desligada (503).
jarvis.pastas.decisoes=${JARVIS_PASTA_DECISOES:}
# Ticket 022: raiz do projeto para o vigia de integridade. Vazio = duas pastas acima de java/bracos.
jarvis.sentinela.projeto=${JARVIS_PASTA_PROJETO:}
# Ticket 034: isca (honeytoken). Token FALSO e arquivo com dados INVENTADOS. Vazio = isca desligada.
jarvis.isca.token=${JARVIS_ISCA_TOKEN:}
jarvis.isca.arquivo=${JARVIS_ISCA_ARQUIVO:}
# Ticket 015: arquivo da chave de uso unico da Central (o iniciar.sh liga). Vazio = Central sem botoes.
jarvis.central.arquivo-chave=${JARVIS_CHAVE_CENTRAL:}
# Ticket 047: Estudio 001 (a dupla constroi jogos). So dentro desta pasta. Padrao: workSpace/estudio-jogos.
jarvis.estudio.pasta=${JARVIS_PASTA_ESTUDIO:${user.home}/workSpace/estudio-jogos}

# Log em arquivo (Ticket 010): historico de auditoria que nao some ao fechar a API.
# So liga pelo iniciar.sh (JARVIS_LOG=logs/bracos.log): os testes nao sujam o log real.
# Fica em java/bracos/logs/ (fora do Git). Troca de arquivo a cada 10 MB, guarda 14 dias.
logging.file.name=${JARVIS_LOG:}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
