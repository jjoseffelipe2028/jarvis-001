spring.application.name=bracos


# Seguranca: so o meu PC acessa (nada aberto para a rede)
server.address=127.0.0.1
server.port=8080

# Token secreto e pastas: valores vem do .env (via iniciar.sh). Vazio = recusa tudo (falha fechada).
jarvis.token=${JARVIS_TOKEN:}
jarvis.pastas.daily=${JARVIS_PASTA_DAILY:}
jarvis.pastas.git=${JARVIS_PASTA_GIT:}

# Log em arquivo (Ticket 010): historico de auditoria que nao some ao fechar a API.
# So liga pelo iniciar.sh (JARVIS_LOG=logs/bracos.log): os testes nao sujam o log real.
# Fica em java/bracos/logs/ (fora do Git). Troca de arquivo a cada 10 MB, guarda 14 dias.
logging.file.name=${JARVIS_LOG:}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
